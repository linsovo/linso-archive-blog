# ============================================================
# 侧栏自定义卡片（Butterfly 内置机制：site.data.widget）
#
# 改完执行：hexo g -d
#
# 图标两种写法：
#   1) FontAwesome 图标 → <i class="fas fa-camera"></i>
#      图标名去 https://fontawesome.com/search 搜，复制 class 就行
#      注意前缀：fas = 实心图标，fab = 品牌图标（Python/Windows/Ubuntu 等）
#   2) 自己的图片 → 图片放进 source/img/，然后写
#      <img src="/img/amd.png">   （品牌 Logo 用这种，比如 AMD、一加）
#
# 加一条：复制一整行 <span class="ly-tag">...</span>
# 加一组：复制整个 <div class="ly-sec">...</div>
# ============================================================

